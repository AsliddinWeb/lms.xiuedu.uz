<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject|default('XIU LMS') }}</title>
</head>
<body style="margin:0;padding:0;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0a0a0a;line-height:1.5;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#fafafa;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #e4e4e7;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="padding:32px 32px 24px;">
              <table role="presentation" cellspacing="0" cellpadding="0">
                <tr>
                  <td>
                    <div style="width:36px;height:36px;background:#0a0a0a;color:#fff;display:inline-grid;place-items:center;font-family:'SF Mono',Menlo,monospace;font-weight:700;border-radius:6px;font-size:13px;line-height:36px;text-align:center;">LMS</div>
                  </td>
                  <td style="padding-left:12px;font-weight:600;font-size:15px;">XIU EduPlatform</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px;border-top:1px solid #e4e4e7;background:#fafafa;font-size:12px;color:#71717a;">
              <div style="font-family:'SF Mono',Menlo,monospace;text-transform:uppercase;letter-spacing:0.05em;font-size:10px;margin-bottom:8px;">559-son qaror asosida</div>
              <div>Bu xat avtomatik yuborildi — javob bermang. Yordam: support@xiuedu.uz</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
